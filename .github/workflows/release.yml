name: Release

# Push a tag like v0.1.1 to build the Windows desktop installer (signed
# for the in-app updater) and the Android debug APK, and attach both to
# a GitHub Release for that tag. Play Store publishing stays a separate,
# manual step once Android releases are ready for that.
on:
  push:
    tags:
      - "v*"

jobs:
  desktop:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install web dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Reelix ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false

  android:
    runs-on: ubuntu-latest
    needs: desktop
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install web dependencies and build
        working-directory: web
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Sync Capacitor Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Attach APK to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "mobile/android/app/build/outputs/apk/debug/app-debug.apk" --clobber
