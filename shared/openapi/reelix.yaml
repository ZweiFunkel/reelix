openapi: 3.1.0
info:
  title: Reelix API
  version: 0.1.0
  description: >
    Reelix Core server API. Drives both the Go server handlers (via
    oapi-codegen) and the TypeScript client (via openapi-typescript /
    openapi-fetch) from this single spec.

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/admin/system/version:
    get:
      operationId: getSystemVersion
      summary: Current/latest version info for the in-app update flow
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemVersion"

  /api/admin/sessions:
    get:
      operationId: getAdminSessions
      summary: Active login sessions — who's logged in, when last seen, and what they're playing right now
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminSession"

  /api/admin/users:
    get:
      operationId: getAdminUsers
      summary: List every account
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createAdminUser
      summary: Create another account to share the server with
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [admin, user]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Username already taken

  /api/admin/users/{userId}/role:
    patch:
      operationId: updateAdminUserRole
      summary: Promote/demote an account (cannot demote your own)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [admin, user]
      responses:
        "200":
          description: Updated

  /api/setup/status:
    get:
      operationId: getSetupStatus
      summary: Whether the first-run admin account still needs to be created
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                properties:
                  needsSetup:
                    type: boolean

  /api/setup/admin:
    post:
      operationId: setupAdmin
      summary: Create the first admin account (only works while needsSetup is true)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupAdminRequest"
      responses:
        "201":
          description: Admin account created and session started

  /api/auth/login:
    post:
      operationId: login
      summary: Log in and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"

  /api/auth/logout:
    post:
      operationId: logout
      summary: End the current session
      responses:
        "204":
          description: Logged out

  /api/auth/me:
    get:
      operationId: getMe
      summary: Current user, their profiles, and the active profile (if any)
      responses:
        "200":
          description: Current session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
    patch:
      operationId: updateMe
      summary: Update the current account's email and/or username (either optional, at least one required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                username:
                  type: string
      responses:
        "200":
          description: Updated
        "409":
          description: Username already taken

  /api/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request a password-reset code by email (always 200, doesn't leak account existence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        "200":
          description: If the account has an email on file, a reset code was sent

  /api/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset a password using the emailed code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, code, newPassword]
              properties:
                username:
                  type: string
                code:
                  type: string
                newPassword:
                  type: string
      responses:
        "200":
          description: Password changed, all sessions for the account signed out

  /api/auth/send-verification:
    post:
      operationId: sendVerification
      summary: Email a verification code to the account's current address (requires an email to already be set)
      responses:
        "200":
          description: Code sent (or logged, if SMTP isn't configured)

  /api/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Confirm the emailed verification code, marking the account's email as verified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Email verified

  /api/profiles:
    get:
      operationId: listProfiles
      summary: List profiles for the current account
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
    post:
      operationId: createProfile
      summary: Add a profile (e.g. a kid profile with a PIN) to the current account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /api/profiles/{profileId}/select:
    post:
      operationId: selectProfile
      summary: Select the active profile for this session ("who's watching")
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pin:
                  type: string
      responses:
        "200":
          description: Profile selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /api/libraries:
    get:
      operationId: listLibraries
      summary: List configured libraries
      responses:
        "200":
          description: Libraries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Library"
    post:
      operationId: createLibrary
      summary: Add a new library (folder or M3U source)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"

  /api/libraries/{libraryId}:
    delete:
      operationId: deleteLibrary
      summary: Unregister a library (never touches files on disk — admin only)
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "204":
          description: Deleted

  /api/libraries/{libraryId}/scan:
    post:
      operationId: triggerLibraryScan
      summary: Trigger a rescan of a library
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "202":
          description: Scan started

  /api/libraries/{libraryId}/upload:
    post:
      operationId: uploadToLibrary
      summary: Upload a file directly into a library's root (requires a writable path — see CreateLibraryRequest.managed), then rescans it
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded, rescan started

  /api/libraries/{libraryId}/root:
    get:
      operationId: getLibraryRoot
      summary: Browse a library's top level (root categories + root-level items)
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "200":
          description: Root of the library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryChildren"

  /api/libraries/{libraryId}/recent:
    get:
      operationId: getLibraryRecent
      summary: A library's most-recently-added items, flattened across all its categories
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "200":
          description: Recently added items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaItem"

  /api/continue-watching:
    get:
      operationId: getContinueWatching
      summary: Items the active profile started but hasn't finished, most-recent first
      responses:
        "200":
          description: In-progress items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaItem"

  /api/categories/{categoryId}:
    get:
      operationId: getCategory
      summary: A single category's own name/path — used to rebuild breadcrumbs after a page reload
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /api/categories/{categoryId}/children:
    get:
      operationId: getCategoryChildren
      summary: Browse a category's subcategories and playable items
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Children of the category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryChildren"

  /api/media-items/{mediaItemId}:
    get:
      operationId: getMediaItem
      summary: Get media item detail
      parameters:
        - name: mediaItemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Media item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
    delete:
      operationId: deleteMediaItem
      summary: Permanently delete this item's row AND its underlying file (admin only, irreversible)
      parameters:
        - name: mediaItemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /api/media-items/{mediaItemId}/stream:
    get:
      operationId: streamMediaItem
      summary: Direct-play (Range-served) or transcoded (HLS) playback
      parameters:
        - name: mediaItemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Media stream (raw bytes or HLS playlist depending on negotiation)

  /api/media-items/{mediaItemId}/thumbnail:
    get:
      operationId: getThumbnail
      summary: Generated thumbnail for a photo (404 if none was generated, e.g. undecodable formats like HEIC)
      parameters:
        - name: mediaItemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: JPEG thumbnail

  /api/media-items/{mediaItemId}/siblings:
    get:
      operationId: getMediaItemSiblings
      summary: Other items in the same folder, ordered by episode number when available — the "More from Season X" row, and how the player finds what's next
      parameters:
        - name: mediaItemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sibling items (includes this one)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaItem"

  /api/media-items/{mediaItemId}/show:
    get:
      operationId: getShow
      summary: Every episode of the show this item belongs to, across the whole library, grouped by season
      parameters:
        - name: mediaItemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Show detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Show"
        "400":
          description: This item isn't part of a TV show

  /api/media-items/{mediaItemId}/progress:
    post:
      operationId: updateProgress
      summary: Report playback position for the active profile
      parameters:
        - name: mediaItemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgressRequest"
      responses:
        "204":
          description: Recorded

  /api/channels/{channelId}:
    get:
      operationId: getChannel
      summary: Get M3U channel detail
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"

  /api/channels/{channelId}/stream:
    get:
      operationId: streamChannel
      summary: Redirects to the channel's external stream URL (live, non-seekable)
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "302":
          description: Redirect to the external stream

components:
  parameters:
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: ok

    SystemVersion:
      type: object
      properties:
        current:
          type: string
        latestAvailable:
          type: string
          nullable: true
        updateMechanism:
          type: string
          enum: [none, binary, docker-sidecar]
        updateCheckEnabled:
          type: boolean

    Library:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        rootPath:
          type: string
        type:
          type: string
          enum: [FOLDER, PHOTO, M3U]
        lastScannedAt:
          type: string
          format: date-time
          nullable: true

    CreateLibraryRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        rootPath:
          description: Required unless managed is true
          type: string
        type:
          type: string
          enum: [FOLDER, PHOTO, M3U]
        managed:
          description: Root the library under the server's writable uploads directory instead of a host-mounted rootPath, so it can be uploaded into from the web UI
          type: boolean

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        path:
          type: string
        parentCategoryId:
          type: integer
          nullable: true

    Progress:
      type: object
      properties:
        positionSeconds:
          type: number
        watched:
          type: boolean

    MediaItem:
      description: >
        A playable browse-listing entry — a local video/photo
        (itemType=media_item), an M3U channel (itemType=channel), or a
        synthetic grouped tile standing in for a whole TV show
        (itemType=show, id is one representative episode's id — see
        GET /api/media-items/{id}/show) — sharing one shape so the
        browse API and client don't need to special-case the source.
      type: object
      properties:
        id:
          type: integer
        itemType:
          type: string
          enum: [media_item, channel, show]
        title:
          type: string
        filePath:
          type: string
        durationSeconds:
          type: number
          nullable: true
        mediaType:
          type: string
        progress:
          allOf:
            - $ref: "#/components/schemas/Progress"
          nullable: true
        posterUrl:
          description: TMDb poster artwork, when a match was found (requires an admin-configured TMDb API key)
          type: string
          nullable: true
        backdropUrl:
          description: TMDb backdrop artwork, when a match was found
          type: string
          nullable: true
        overview:
          description: TMDb synopsis, when a match was found
          type: string
          nullable: true
        rating:
          description: TMDb vote average, when a match was found
          type: number
          nullable: true
        showTitle:
          description: Set only for TV episodes
          type: string
          nullable: true
        seasonNumber:
          type: integer
          nullable: true
        episodeNumber:
          type: integer
          nullable: true

    UpdateProgressRequest:
      type: object
      required: [positionSeconds]
      properties:
        positionSeconds:
          type: number
        durationSeconds:
          type: number
          nullable: true
        watched:
          type: boolean

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
        email:
          type: string
          nullable: true
        emailVerified:
          type: boolean

    Profile:
      type: object
      properties:
        id:
          type: integer
        displayName:
          type: string
        avatar:
          type: string
          nullable: true
        isKid:
          type: boolean

    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        activeProfileId:
          type: integer
          nullable: true

    SetupAdminRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    CreateProfileRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
        isKid:
          type: boolean
        pin:
          type: string

    NowPlaying:
      type: object
      properties:
        title:
          type: string
        itemType:
          type: string
          enum: [media_item, channel]
        isLive:
          type: boolean
        positionSeconds:
          type: number

    AdminSession:
      type: object
      properties:
        sessionId:
          type: string
        username:
          type: string
        profileName:
          type: string
          nullable: true
        isKid:
          type: boolean
        loginAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        nowPlaying:
          allOf:
            - $ref: "#/components/schemas/NowPlaying"
          nullable: true

    CategoryChildren:
      type: object
      properties:
        subcategories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        items:
          type: array
          items:
            $ref: "#/components/schemas/MediaItem"

    ShowSeason:
      type: object
      properties:
        seasonNumber:
          type: integer
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/MediaItem"

    CastMember:
      type: object
      properties:
        name:
          type: string
        character:
          type: string
        photoUrl:
          type: string
          nullable: true

    Show:
      type: object
      properties:
        title:
          type: string
        overview:
          type: string
          nullable: true
        posterUrl:
          type: string
          nullable: true
        backdropUrl:
          type: string
          nullable: true
        cast:
          type: array
          items:
            $ref: "#/components/schemas/CastMember"
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/ShowSeason"
